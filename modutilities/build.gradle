plugins {
    id "java"
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.5.1"
}

group = "com.chloride"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
    maven { url = uri("https://repo.codemc.io/repository/maven-releases/") }
    maven { url = uri("https://repo.codemc.io/repository/maven-snapshots/") }
}

dependencies {
    annotationProcessor files("./lib/lombok-1.18.38.jar")
    compileOnly files("./lib/lombok-1.18.38.jar")

    compileOnly "org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT"

    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    implementation "com.github.retrooper:packetevents-spigot:2.13.0"
}

shadowJar {
    relocate "co.aikar.commands", "com.chloride.modutilities.shaded.acf"
    relocate "co.aikar.locales", "com.chloride.modutilities.shaded.locales"

    relocate "com.github.retrooper", "com.chloride.modutilities.shaded.packetevents"
    relocate "io.github.retrooper", "com.chloride.modutilities.shaded.packetevents"
    relocate "net.kyori", "com.chloride.modutilities.shaded.kyori"
    relocate "com.google.gson", "com.chloride.modutilities.shaded.gson"
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }

    build {
        dependsOn(tasks.shadowJar)
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset "UTF-8"
    filesMatching("plugin.yml") {
        expand props
    }
}
